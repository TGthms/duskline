name: Deploy Duskline to GitHub Pages
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Skip superseded release
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$latest" = "${{ github.event.workflow_run.head_sha }}"
      - name: Stage site files
        run: |
          mkdir -p _site
          rsync -a --exclude node_modules --exclude test --exclude e2e --exclude tools --exclude .git --exclude .github --exclude test-results --exclude playwright-report --exclude playwright.config.js --exclude package.json --exclude package-lock.json --exclude _site ./ _site/
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
