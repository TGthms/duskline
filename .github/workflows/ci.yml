name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  check-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run weather:i18n && git diff --exit-code -- src/js/data/weather-packs src/js/data/weather-locale-registry.js
      - run: npm run test:unit
  browsers:
    needs: check-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {project: chromium, browser: chromium, part: 1, total: 1}
          - {project: firefox, browser: firefox, part: 1, total: 1}
          # Desktop WebKit is ~3.5x slower than Chromium on the same suite;
          # shard it to stay comfortably within the job deadline.
          - {project: webkit, browser: webkit, part: 1, total: 2}
          - {project: webkit, browser: webkit, part: 2, total: 2}
          # Preserve all mobile checks while keeping native-control/locale
          # flows within the job deadline. Both shards gate deployment.
          - {project: mobile-webkit, browser: webkit, part: 1, total: 2}
          - {project: mobile-webkit, browser: webkit, part: 2, total: 2}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.part }}/${{ matrix.total }} --reporter=list
        env:
          CI: true
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-failures-${{ matrix.project }}-${{ matrix.part }}
          path: test-results/
          retention-days: 14

  visual:
    needs: check-and-test
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:visual
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: visual-failures
          path: test-results/
          retention-days: 14
