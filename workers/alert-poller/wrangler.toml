name = "duskline-alert-poller"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "PUSH_DB"
database_name = "duskline-notifications"
database_id = "f487c40d-160a-4ecf-ba1f-2c8aab99aadc"
migrations_dir = "migrations"

[observability]
enabled = true
# Keep the existing VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY and VAPID_SUBJECT secrets.
# Pages uses a PUSH_SENDER service binding with the Default entrypoint.
